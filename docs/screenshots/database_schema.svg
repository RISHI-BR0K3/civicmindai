<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" style="background:#0b0f19; border-radius:12px; font-family:'Segoe UI',system-ui,sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Title Header -->
  <rect x="0" y="0" width="1000" height="42" fill="#111827"/>
  <circle cx="24" cy="21" r="6" fill="#ef4444"/>
  <circle cx="44" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="21" r="6" fill="#10b981"/>
  <text x="500" y="26" fill="#9ca3af" font-size="13" font-weight="600" text-anchor="middle">CivicMind AI — Relational Database Schema (SQLite: civic_app.db)</text>

  <text x="500" y="75" fill="#f9fafb" font-size="22" font-weight="800" text-anchor="middle">DATABASE ENTITY-RELATIONSHIP ARCHITECTURE</text>
  <text x="500" y="98" fill="#818cf8" font-size="13" font-weight="600" text-anchor="middle">SQLAlchemy ORM Data Models &amp; Foreign Key Constraints</text>

  <!-- TABLE 1: DEPARTMENTS -->
  <g transform="translate(50, 130)" filter="url(#cardShadow)">
    <rect width="260" height="150" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
    <rect width="260" height="36" rx="8" fill="#047857"/>
    <text x="130" y="23" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">departments</text>
    
    <text x="15" y="60" fill="#fbbf24" font-size="12" font-weight="600">PK  id</text>
    <text x="180" y="60" fill="#9ca3af" font-size="12">INTEGER</text>
    <line x1="15" y1="70" x2="245" y2="70" stroke="#374151"/>
    
    <text x="15" y="90" fill="#e5e7eb" font-size="12">name</text>
    <text x="180" y="90" fill="#9ca3af" font-size="12">VARCHAR (UQ)</text>
    
    <rect x="15" y="108" width="230" height="26" rx="4" fill="#064e3b"/>
    <text x="25" y="125" fill="#6ee7b7" font-size="10">Roads | Electricity | Water | Waste</text>
  </g>

  <!-- TABLE 2: USERS -->
  <g transform="translate(50, 310)" filter="url(#cardShadow)">
    <rect width="260" height="250" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
    <rect width="260" height="36" rx="8" fill="#1d4ed8"/>
    <text x="130" y="23" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">users</text>
    
    <text x="15" y="58" fill="#fbbf24" font-size="11" font-weight="600">PK  id</text>
    <text x="185" y="58" fill="#9ca3af" font-size="11">INTEGER</text>
    <line x1="15" y1="67" x2="245" y2="67" stroke="#374151"/>
    
    <text x="15" y="85" fill="#e5e7eb" font-size="11">first_name, last_name</text>
    <text x="185" y="85" fill="#9ca3af" font-size="11">VARCHAR</text>
    
    <text x="15" y="105" fill="#e5e7eb" font-size="11">email</text>
    <text x="185" y="105" fill="#9ca3af" font-size="11">VARCHAR (UQ)</text>
    
    <text x="15" y="125" fill="#e5e7eb" font-size="11">password_hash</text>
    <text x="185" y="125" fill="#9ca3af" font-size="11">VARCHAR</text>
    
    <text x="15" y="145" fill="#e5e7eb" font-size="11">contact_number</text>
    <text x="185" y="145" fill="#9ca3af" font-size="11">VARCHAR</text>

    <text x="15" y="165" fill="#e5e7eb" font-size="11">occupation</text>
    <text x="185" y="165" fill="#9ca3af" font-size="11">VARCHAR</text>

    <text x="15" y="185" fill="#e5e7eb" font-size="11">role (CITIZEN/OFFICER/ADMIN)</text>
    <text x="185" y="185" fill="#9ca3af" font-size="11">VARCHAR</text>

    <text x="15" y="205" fill="#38bdf8" font-size="11" font-weight="600">FK  department_id</text>
    <text x="185" y="205" fill="#9ca3af" font-size="11">INTEGER</text>

    <line x1="15" y1="215" x2="245" y2="215" stroke="#374151"/>
    <text x="15" y="235" fill="#6ee7b7" font-size="10">Secured with Salted Bcrypt &amp; JWT</text>
  </g>

  <!-- TABLE 3: COMPLAINTS -->
  <g transform="translate(420, 130)" filter="url(#cardShadow)">
    <rect width="280" height="430" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
    <rect width="280" height="36" rx="8" fill="#7c3aed"/>
    <text x="140" y="23" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">complaints</text>
    
    <text x="15" y="58" fill="#fbbf24" font-size="11" font-weight="600">PK  id</text>
    <text x="210" y="58" fill="#9ca3af" font-size="11">INTEGER</text>
    <line x1="15" y1="67" x2="265" y2="67" stroke="#374151"/>
    
    <text x="15" y="86" fill="#38bdf8" font-size="11" font-weight="600">FK  citizen_id</text>
    <text x="210" y="86" fill="#9ca3af" font-size="11">INTEGER</text>
    
    <text x="15" y="110" fill="#e5e7eb" font-size="11">description</text>
    <text x="210" y="110" fill="#9ca3af" font-size="11">TEXT</text>
    
    <text x="15" y="134" fill="#e5e7eb" font-size="11">latitude</text>
    <text x="210" y="134" fill="#9ca3af" font-size="11">FLOAT</text>
    
    <text x="15" y="158" fill="#e5e7eb" font-size="11">longitude</text>
    <text x="210" y="158" fill="#9ca3af" font-size="11">FLOAT</text>

    <text x="15" y="182" fill="#e5e7eb" font-size="11">address (Reverse Geocoded)</text>
    <text x="210" y="182" fill="#9ca3af" font-size="11">VARCHAR</text>

    <text x="15" y="206" fill="#e5e7eb" font-size="11">image_url (Base64 JPEG)</text>
    <text x="210" y="206" fill="#9ca3af" font-size="11">TEXT</text>

    <text x="15" y="230" fill="#38bdf8" font-size="11" font-weight="600">FK  department_id (AI Assigned)</text>
    <text x="210" y="230" fill="#9ca3af" font-size="11">INTEGER</text>

    <text x="15" y="254" fill="#e5e7eb" font-size="11">status (Pending/In Progress/Resolved)</text>
    <text x="210" y="254" fill="#9ca3af" font-size="11">VARCHAR</text>

    <text x="15" y="278" fill="#e5e7eb" font-size="11">created_at (Timestamp UTC)</text>
    <text x="210" y="278" fill="#9ca3af" font-size="11">DATETIME</text>

    <line x1="15" y1="295" x2="265" y2="295" stroke="#374151"/>
    
    <rect x="15" y="310" width="250" height="100" rx="6" fill="#0f172a" stroke="#4b5563" stroke-width="1"/>
    <text x="25" y="330" fill="#c4b5fd" font-size="11" font-weight="700">🔒 Data Isolation &amp; Integrity:</text>
    <text x="25" y="348" fill="#94a3b8" font-size="10">• Scoped GET /api/complaints/my</text>
    <text x="25" y="364" fill="#94a3b8" font-size="10">• Citizens only view citizen_id == self</text>
    <text x="25" y="380" fill="#94a3b8" font-size="10">• Triggers DBSCAN recalculation</text>
    <text x="25" y="396" fill="#34d399" font-size="10">✓ Cascading ORM relationship</text>
  </g>

  <!-- TABLE 4: HOTSPOTS -->
  <g transform="translate(740, 130)" filter="url(#cardShadow)">
    <rect width="220" height="240" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
    <rect width="220" height="36" rx="8" fill="#b91c1c"/>
    <text x="110" y="23" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">hotspots</text>
    
    <text x="15" y="58" fill="#fbbf24" font-size="11" font-weight="600">PK  id</text>
    <text x="150" y="58" fill="#9ca3af" font-size="11">INTEGER</text>
    <line x1="15" y1="67" x2="205" y2="67" stroke="#374151"/>
    
    <text x="15" y="86" fill="#e5e7eb" font-size="11">center_latitude</text>
    <text x="150" y="86" fill="#9ca3af" font-size="11">FLOAT</text>
    
    <text x="15" y="110" fill="#e5e7eb" font-size="11">center_longitude</text>
    <text x="150" y="110" fill="#9ca3af" font-size="11">FLOAT</text>
    
    <text x="15" y="134" fill="#e5e7eb" font-size="11">complaint_count</text>
    <text x="150" y="134" fill="#9ca3af" font-size="11">INTEGER</text>
    
    <text x="15" y="158" fill="#e5e7eb" font-size="11">severity (Low/Med/High)</text>
    <text x="150" y="158" fill="#9ca3af" font-size="11">VARCHAR</text>

    <text x="15" y="182" fill="#e5e7eb" font-size="11">created_at</text>
    <text x="150" y="182" fill="#9ca3af" font-size="11">DATETIME</text>

    <line x1="15" y1="195" x2="205" y2="195" stroke="#374151"/>
    <text x="15" y="215" fill="#f87171" font-size="10" font-weight="700">Purged on resolution</text>
    <text x="15" y="230" fill="#9ca3af" font-size="9">Dynamic eviction via DBSCAN</text>
  </g>

  <!-- Connectors -->
  <!-- Users -> Complaints (1 : N) -->
  <path d="M 310 400 L 420 220" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  <circle cx="310" cy="400" r="4" fill="#38bdf8"/>
  <polygon points="415,220 420,220 420,226" fill="#38bdf8"/>
  <text x="350" y="300" fill="#38bdf8" font-size="11" font-weight="700">1 : N</text>

  <!-- Departments -> Complaints (1 : N) -->
  <path d="M 310 200 L 420 360" stroke="#34d399" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  <circle cx="310" cy="200" r="4" fill="#34d399"/>
  <polygon points="415,360 420,360 420,354" fill="#34d399"/>
  <text x="350" y="260" fill="#34d399" font-size="11" font-weight="700">1 : N</text>

  <!-- Complaints -> Hotspots (Aggregation) -->
  <path d="M 700 240 L 740 240" stroke="#f87171" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  <circle cx="700" cy="240" r="4" fill="#f87171"/>
  <polygon points="735,236 740,240 735,244" fill="#f87171"/>
  <text x="710" y="230" fill="#f87171" font-size="10" font-weight="700">DBSCAN</text>

  <!-- Footer -->
  <text x="500" y="585" fill="#6b7280" font-size="12" text-anchor="middle">Physical Persistence: SQLite 3 engine stored locally at ./civic_app.db with check_same_thread=False</text>
</svg>
