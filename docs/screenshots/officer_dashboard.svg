<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" width="100%" height="100%" style="background:#f8fafc; border-radius:12px; font-family:'Segoe UI',system-ui,sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Browser Header -->
  <rect x="0" y="0" width="1100" height="42" fill="#1e293b"/>
  <circle cx="24" cy="21" r="6" fill="#ef4444"/>
  <circle cx="44" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="21" r="6" fill="#10b981"/>
  <rect x="200" y="8" width="700" height="26" rx="6" fill="#0f172a"/>
  <text x="550" y="25" fill="#94a3b8" font-size="12" text-anchor="middle">http://localhost:5173/officer — CivicMind AI Manager / Officer Portal</text>

  <!-- Navbar -->
  <rect x="0" y="42" width="1100" height="64" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="80" fill="#0f172a" font-size="20" font-weight="800">CivicMind <tspan fill="#6366f1">AI</tspan></text>
  
  <!-- Officer Profile & Logout -->
  <g transform="translate(830, 56)">
    <rect width="160" height="34" rx="17" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <circle cx="18" cy="17" r="5" fill="#2563eb"/>
    <text x="32" y="22" fill="#1e40af" font-size="12" font-weight="700">Manager: Engineering</text>
    <rect x="170" y="0" width="75" height="34" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="207" y="22" fill="#991b1b" font-size="12" font-weight="600" text-anchor="middle">Logout</text>
  </g>

  <!-- Page Title & Metrics Pill -->
  <g transform="translate(40, 130)">
    <text x="0" y="24" fill="#0f172a" font-size="22" font-weight="800">Municipal Complaint Triage Queue</text>
    <text x="0" y="46" fill="#64748b" font-size="13">Review reports, contact affected citizens, navigate directly on-site, and update resolution lifecycle.</text>
    
    <g transform="translate(770, 0)">
      <rect width="250" height="38" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
      <circle cx="20" cy="19" r="6" fill="#2563eb"/>
      <text x="35" y="24" fill="#1e40af" font-size="13" font-weight="700">3 Pending Complaints in City</text>
    </g>
  </g>

  <!-- Main Expanded Complaint Card -->
  <g transform="translate(40, 200)" filter="url(#cardShadow)">
    <rect width="1020" height="540" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    
    <!-- Card Header -->
    <rect width="1020" height="54" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="24" y="34" fill="#0f172a" font-size="16" font-weight="800">Ticket #104 — Water Pipe Rupture &amp; Severe Flooding</text>
    
    <rect x="620" y="14" width="150" height="26" rx="6" fill="#dbeafe"/>
    <text x="695" y="31" fill="#1e40af" font-size="11" font-weight="700" text-anchor="middle">💧 Water &amp; Sanitation</text>

    <rect x="780" y="14" width="90" height="26" rx="6" fill="#fef3c7"/>
    <text x="825" y="31" fill="#92400e" font-size="11" font-weight="700" text-anchor="middle">● Pending</text>

    <rect x="880" y="14" width="120" height="26" rx="6" fill="#f1f5f9"/>
    <text x="940" y="31" fill="#475569" font-size="11" font-weight="600" text-anchor="middle">Hide Details ▲</text>

    <!-- Details Grid -->
    <g transform="translate(24, 75)">
      
      <!-- Left Column: Citizen & Description -->
      <g transform="translate(0, 0)">
        <!-- Description -->
        <text x="0" y="16" fill="#64748b" font-size="11" font-weight="700">FULL COMPLAINT DESCRIPTION</text>
        <rect x="0" y="26" width="580" height="60" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="14" y="50" fill="#0f172a" font-size="13">"Water pipe leaking heavily near main junction. Flowing into street,</text>
        <text x="14" y="70" fill="#0f172a" font-size="13">causing traffic jam and low pressure in houses."</text>

        <!-- Citizen Contact Card (Importance Highlight!) -->
        <text x="0" y="112" fill="#64748b" font-size="11" font-weight="700">REPORTER CONTACT CARD (DIRECT CITIZEN REACH)</text>
        <rect x="0" y="122" width="580" height="90" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
        
        <circle cx="36" cy="167" r="22" fill="#3b82f6"/>
        <text x="36" y="174" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">A</text>
        
        <text x="72" y="150" fill="#1e293b" font-size="14" font-weight="800">Alice Freeman</text>
        <text x="175" y="150" fill="#64748b" font-size="12">• Resident</text>
        
        <!-- Phone dialing action -->
        <rect x="72" y="162" width="160" height="32" rx="6" fill="#2563eb"/>
        <text x="82" y="182" fill="#ffffff" font-size="11" font-weight="700">📞 +91 98765 43210</text>
        
        <!-- Email action -->
        <rect x="242" y="162" width="150" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="252" y="182" fill="#1e293b" font-size="11" font-weight="600">✉️ alice@test.com</text>

        <!-- Address & Google Maps Routing -->
        <text x="0" y="236" fill="#64748b" font-size="11" font-weight="700">LOCATION &amp; TURN-BY-TURN NAVIGATION</text>
        <rect x="0" y="246" width="580" height="75" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="14" y="270" fill="#0f172a" font-size="12" font-weight="600">Old Kuyavarpalayam Road, Munichalai, Madurai South, TN, 625009</text>
        <text x="14" y="290" fill="#64748b" font-size="11">GPS Coordinates: 9.925200, 78.119800</text>
        
        <rect x="0" y="332" width="240" height="38" rx="8" fill="#10b981"/>
        <text x="120" y="356" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">🗺️ Launch Google Maps GPS</text>
      </g>

      <!-- Right Column: Visual Evidence & Lifecycle Update -->
      <g transform="translate(620, 0)">
        <text x="0" y="16" fill="#64748b" font-size="11" font-weight="700">ATTACHED CITIZEN EVIDENCE PHOTO</text>
        
        <!-- Photo Box Mock -->
        <rect x="0" y="26" width="350" height="200" rx="8" fill="#1e293b"/>
        <!-- Street water leak illustration mock -->
        <path d="M 0,160 Q 150,110 350,140 L 350,200 L 0,200 Z" fill="#38bdf8" opacity="0.6"/>
        <line x1="80" y1="26" x2="160" y2="200" stroke="#475569" stroke-width="6"/>
        <line x1="280" y1="26" x2="200" y2="200" stroke="#475569" stroke-width="6"/>
        <rect x="15" y="38" width="110" height="22" rx="4" fill="#000000" opacity="0.7"/>
        <text x="22" y="53" fill="#a7f3d0" font-size="10">✓ WebRTC Verified</text>
        <text x="175" y="185" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Water Pipe Leaking On-Site</text>

        <!-- Status Management Action -->
        <text x="0" y="250" fill="#64748b" font-size="11" font-weight="700">UPDATE RESOLUTION STATUS</text>
        <rect x="0" y="260" width="350" height="42" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
        <text x="14" y="286" fill="#0f172a" font-size="14" font-weight="700">Pending</text>
        <text x="320" y="286" fill="#6366f1" font-size="14">▼</text>

        <!-- Auto-Eviction Note -->
        <rect x="0" y="315" width="350" height="55" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
        <text x="12" y="333" fill="#065f46" font-size="11" font-weight="700">⚡ Dynamic Hotspot Eviction:</text>
        <text x="12" y="350" fill="#047857" font-size="10">Selecting "Resolved" triggers background DBSCAN to</text>
        <text x="12" y="363" fill="#047857" font-size="10">immediately remove this issue from the city hotspot radar.</text>
      </g>
    </g>

    <!-- Bottom Action Bar -->
    <rect x="0" y="480" width="1020" height="60" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="24" y="515" fill="#64748b" font-size="12">Registered UTC: 2026-09-19 19:25:16 • SLA Response Target: 24 Hours</text>
    <rect x="850" y="493" width="145" height="34" rx="6" fill="#2563eb"/>
    <text x="922" y="515" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Save Changes</text>
  </g>
</svg>
