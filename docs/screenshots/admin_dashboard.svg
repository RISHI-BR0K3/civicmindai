<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 840" width="100%" height="100%" style="background:#0f172a; border-radius:12px; font-family:'Segoe UI',system-ui,sans-serif;">
  <defs>
    <linearGradient id="adminCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="adminShadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Browser Header -->
  <rect x="0" y="0" width="1100" height="42" fill="#1e293b"/>
  <circle cx="24" cy="21" r="6" fill="#ef4444"/>
  <circle cx="44" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="21" r="6" fill="#10b981"/>
  <rect x="200" y="8" width="700" height="26" rx="6" fill="#0f172a"/>
  <text x="550" y="25" fill="#94a3b8" font-size="12" text-anchor="middle">http://localhost:5173/admin — CivicMind AI Administrator Command Center</text>

  <!-- Navbar -->
  <rect x="0" y="42" width="1100" height="64" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="40" y="80" fill="#ffffff" font-size="20" font-weight="800">CivicMind <tspan fill="#818cf8">AI Admin</tspan></text>
  
  <!-- Admin Profile & Logout -->
  <g transform="translate(830, 56)">
    <rect width="160" height="34" rx="17" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
    <circle cx="18" cy="17" r="5" fill="#818cf8"/>
    <text x="32" y="22" fill="#c7d2fe" font-size="12" font-weight="700">Admin: City Controller</text>
    <rect x="170" y="0" width="75" height="34" rx="8" fill="#7f1d1d" stroke="#ef4444" stroke-width="1"/>
    <text x="207" y="22" fill="#fecaca" font-size="12" font-weight="600" text-anchor="middle">Logout</text>
  </g>

  <!-- Top 4 KPI Metric Cards -->
  <g transform="translate(40, 130)">
    <!-- KPI 1 -->
    <g transform="translate(0, 0)" filter="url(#adminShadow)">
      <rect width="235" height="90" rx="10" fill="url(#adminCardGrad)" stroke="#334155" stroke-width="1.5"/>
      <text x="20" y="32" fill="#94a3b8" font-size="12" font-weight="600">TOTAL TICKETS FILED</text>
      <text x="20" y="68" fill="#ffffff" font-size="28" font-weight="800">24</text>
      <text x="80" y="66" fill="#38bdf8" font-size="12">↑ 12% this week</text>
    </g>

    <!-- KPI 2 -->
    <g transform="translate(260, 0)" filter="url(#adminShadow)">
      <rect width="235" height="90" rx="10" fill="url(#adminCardGrad)" stroke="#334155" stroke-width="1.5"/>
      <text x="20" y="32" fill="#94a3b8" font-size="12" font-weight="600">RESOLVED TICKETS</text>
      <text x="20" y="68" fill="#34d399" font-size="28" font-weight="800">18</text>
      <text x="80" y="66" fill="#10b981" font-size="12">75% Resolution Rate</text>
    </g>

    <!-- KPI 3 -->
    <g transform="translate(520, 0)" filter="url(#adminShadow)">
      <rect width="235" height="90" rx="10" fill="url(#adminCardGrad)" stroke="#b91c1c" stroke-width="1.5"/>
      <text x="20" y="32" fill="#fca5a5" font-size="12" font-weight="600">ACTIVE AI HOTSPOTS</text>
      <text x="20" y="68" fill="#f87171" font-size="28" font-weight="800">2</text>
      <text x="60" y="66" fill="#ef4444" font-size="12">⚠ DBSCAN Clustered</text>
    </g>

    <!-- KPI 4 -->
    <g transform="translate(780, 0)" filter="url(#adminShadow)">
      <rect width="240" height="90" rx="10" fill="url(#adminCardGrad)" stroke="#334155" stroke-width="1.5"/>
      <text x="20" y="32" fill="#94a3b8" font-size="12" font-weight="600">REGISTERED USERS</text>
      <text x="20" y="68" fill="#c084fc" font-size="28" font-weight="800">47</text>
      <text x="75" y="66" fill="#a855f7" font-size="12">42 Citizens • 5 Officers</text>
    </g>
  </g>

  <!-- Middle Section: Live Spatial Hotspot Heatmap & Details -->
  <g transform="translate(40, 245)">
    <!-- Heatmap Container -->
    <g transform="translate(0, 0)" filter="url(#adminShadow)">
      <rect width="610" height="350" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      
      <!-- Leaflet Dark Map Tile representation -->
      <rect x="10" y="10" width="590" height="330" rx="8" fill="#0f172a"/>
      
      <!-- India Outline representation -->
      <path d="M 120,60 L 250,30 L 400,60 L 450,150 L 380,260 L 300,320 L 220,240 L 160,160 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
      
      <!-- Hotspot 1 (Red Pulsating Circle) -->
      <g transform="translate(290, 260)">
        <circle cx="0" cy="0" r="38" fill="#ef4444" opacity="0.25"/>
        <circle cx="0" cy="0" r="22" fill="#ef4444" opacity="0.5"/>
        <circle cx="0" cy="0" r="10" fill="#dc2626"/>
        
        <!-- Hotspot Tooltip -->
        <rect x="-85" y="-62" width="170" height="42" rx="6" fill="#000000" opacity="0.85"/>
        <text x="0" y="-46" fill="#f87171" font-size="11" font-weight="800" text-anchor="middle">🔥 Hotspot: 5 Complaints</text>
        <text x="0" y="-30" fill="#cbd5e1" font-size="10" text-anchor="middle">Madurai South • High Severity</text>
      </g>

      <!-- Hotspot 2 (Orange Pulsating Circle) -->
      <g transform="translate(360, 180)">
        <circle cx="0" cy="0" r="28" fill="#f97316" opacity="0.3"/>
        <circle cx="0" cy="0" r="14" fill="#f97316" opacity="0.6"/>
        <circle cx="0" cy="0" r="7" fill="#ea580c"/>
        
        <!-- Tooltip 2 -->
        <rect x="-70" y="-50" width="140" height="36" rx="6" fill="#000000" opacity="0.85"/>
        <text x="0" y="-36" fill="#fdba74" font-size="10" font-weight="700" text-anchor="middle">🔥 Hotspot: 3 Complaints</text>
        <text x="0" y="-22" fill="#cbd5e1" font-size="9" text-anchor="middle">Chennai Hub • Medium</text>
      </g>

      <!-- Map Controller Info -->
      <rect x="20" y="20" width="220" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="130" y="38" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">📍 Live DBSCAN Radar (India Centered)</text>
    </g>

    <!-- Side Hotspot Intelligence Box -->
    <g transform="translate(635, 0)" filter="url(#adminShadow)">
      <rect width="385" height="350" rx="10" fill="url(#adminCardGrad)" stroke="#334155" stroke-width="1.5"/>
      <text x="20" y="32" fill="#ffffff" font-size="15" font-weight="800">Spatial Intelligence &amp; Clustering</text>
      <text x="20" y="52" fill="#94a3b8" font-size="11">Density-Based Spatial Clustering (DBSCAN)</text>

      <!-- Parameter Card -->
      <rect x="20" y="70" width="345" height="75" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="32" y="92" fill="#818cf8" font-size="11" font-weight="700">DBSCAN Hyperparameters:</text>
      <text x="32" y="112" fill="#cbd5e1" font-size="11">• Epsilon (ε): <tspan fill="#38bdf8" font-weight="700">0.005</tspan> (~500 meter cluster radius)</text>
      <text x="32" y="130" fill="#cbd5e1" font-size="11">• Min Samples: <tspan fill="#38bdf8" font-weight="700">3</tspan> unresolved complaints</text>

      <!-- Eviction logic card -->
      <rect x="20" y="160" width="345" height="85" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="32" y="182" fill="#6ee7b7" font-size="11" font-weight="700">✓ Dynamic Hotspot Eviction Logic</text>
      <text x="32" y="200" fill="#e2e8f0" font-size="10">When an officer changes status to "Resolved",</text>
      <text x="32" y="216" fill="#e2e8f0" font-size="10">the backend purges the hotspot table and runs</text>
      <text x="32" y="232" fill="#e2e8f0" font-size="10">DBSCAN only over remaining active complaints.</text>

      <!-- Department Distribution -->
      <rect x="20" y="260" width="345" height="70" rx="6" fill="#0f172a"/>
      <text x="32" y="280" fill="#94a3b8" font-size="10" font-weight="700">DEPARTMENT LOAD SPLIT:</text>
      <rect x="32" y="292" width="130" height="12" rx="3" fill="#3b82f6"/>
      <rect x="165" y="292" width="75" height="12" rx="3" fill="#10b981"/>
      <rect x="243" y="292" width="55" height="12" rx="3" fill="#f59e0b"/>
      <rect x="301" y="292" width="45" height="12" rx="3" fill="#ef4444"/>
      <text x="32" y="320" fill="#94a3b8" font-size="9">Water (45%) | Roads (26%) | Waste (18%) | Electric (11%)</text>
    </g>
  </g>

  <!-- Bottom Section: Split User Management Table -->
  <g transform="translate(40, 615)" filter="url(#adminShadow)">
    <rect width="1020" height="200" rx="10" fill="url(#adminCardGrad)" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="30" fill="#ffffff" font-size="15" font-weight="800">Role &amp; Personnel Control Center (Split View)</text>
    <text x="24" y="48" fill="#94a3b8" font-size="11">Promote qualified citizens to department field officers, manage credentials, and inspect master records.</text>

    <!-- Table Header -->
    <rect x="20" y="62" width="980" height="28" fill="#1e293b"/>
    <text x="36" y="80" fill="#94a3b8" font-size="11" font-weight="700">NAME</text>
    <text x="200" y="80" fill="#94a3b8" font-size="11" font-weight="700">EMAIL</text>
    <text x="410" y="80" fill="#94a3b8" font-size="11" font-weight="700">CONTACT</text>
    <text x="590" y="80" fill="#94a3b8" font-size="11" font-weight="700">ROLE</text>
    <text x="750" y="80" fill="#94a3b8" font-size="11" font-weight="700">DEPARTMENT</text>
    <text x="910" y="80" fill="#94a3b8" font-size="11" font-weight="700">ACTION</text>

    <!-- User 1: Manager -->
    <text x="36" y="112" fill="#ffffff" font-size="12" font-weight="700">Engineering Manager</text>
    <text x="200" y="112" fill="#cbd5e1" font-size="12">manager@city.com</text>
    <text x="410" y="112" fill="#cbd5e1" font-size="12">+91 94433 11223</text>
    <rect x="590" y="98" width="80" height="20" rx="10" fill="#1e3a8a"/>
    <text x="630" y="112" fill="#93c5fd" font-size="10" font-weight="700" text-anchor="middle">MANAGER</text>
    <text x="750" y="112" fill="#34d399" font-size="12">Water &amp; Sanitation</text>
    <rect x="900" y="98" width="85" height="22" rx="4" fill="#7f1d1d"/>
    <text x="942" y="113" fill="#fecaca" font-size="10" font-weight="600" text-anchor="middle">Demote</text>
    <line x1="20" y1="128" x2="1000" y2="128" stroke="#1e293b"/>

    <!-- User 2: Citizen -->
    <text x="36" y="148" fill="#ffffff" font-size="12" font-weight="700">Alice Freeman</text>
    <text x="200" y="148" fill="#cbd5e1" font-size="12">alice@test.com</text>
    <text x="410" y="148" fill="#cbd5e1" font-size="12">+91 98765 43210</text>
    <rect x="590" y="134" width="75" height="20" rx="10" fill="#064e3b"/>
    <text x="627" y="148" fill="#6ee7b7" font-size="10" font-weight="700" text-anchor="middle">CITIZEN</text>
    <text x="750" y="148" fill="#94a3b8" font-size="12">Public Resident</text>
    <rect x="885" y="134" width="115" height="22" rx="4" fill="#1d4ed8"/>
    <text x="942" y="149" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">Promote to Manager</text>
    <line x1="20" y1="164" x2="1000" y2="164" stroke="#1e293b"/>

    <!-- User 3: Admin -->
    <text x="36" y="184" fill="#ffffff" font-size="12" font-weight="700">System Controller</text>
    <text x="200" y="184" fill="#cbd5e1" font-size="12">admin@city.com</text>
    <text x="410" y="184" fill="#cbd5e1" font-size="12">+91 98940 00000</text>
    <rect x="590" y="170" width="70" height="20" rx="10" fill="#4c1d95"/>
    <text x="625" y="184" fill="#d8b4fe" font-size="10" font-weight="700" text-anchor="middle">ADMIN</text>
    <text x="750" y="184" fill="#a78bfa" font-size="12">All Departments</text>
    <text x="942" y="184" fill="#64748b" font-size="11" font-weight="600" text-anchor="middle">System Root</text>
  </g>
</svg>
