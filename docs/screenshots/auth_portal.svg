<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background:#0f172a; border-radius:12px; font-family:'Segoe UI',system-ui,sans-serif;">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Browser Header -->
  <rect x="0" y="0" width="1000" height="42" fill="#1e293b"/>
  <circle cx="24" cy="21" r="6" fill="#ef4444"/>
  <circle cx="44" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="21" r="6" fill="#10b981"/>
  <rect x="150" y="8" width="700" height="26" rx="6" fill="#0f172a"/>
  <text x="500" y="25" fill="#94a3b8" font-size="12" text-anchor="middle">http://localhost:5173/ — CivicMind AI Auth Portal</text>

  <!-- Navbar -->
  <rect x="0" y="42" width="1000" height="60" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="78" fill="#1e293b" font-size="20" font-weight="800">CivicMind <tspan fill="#6366f1">AI</tspan></text>
  <rect x="830" y="56" width="130" height="32" rx="16" fill="#f1f5f9"/>
  <text x="895" y="77" fill="#64748b" font-size="12" font-weight="600" text-anchor="middle">Not Authenticated</text>

  <!-- Background decorative elements -->
  <circle cx="150" cy="250" r="180" fill="#4f46e5" opacity="0.08"/>
  <circle cx="850" cy="500" r="220" fill="#7c3aed" opacity="0.08"/>

  <!-- Centered Auth Card Container -->
  <g transform="translate(240, 130)" filter="url(#boxShadow)">
    <rect width="520" height="510" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Header of Card -->
    <text x="260" y="45" fill="#0f172a" font-size="22" font-weight="800" text-anchor="middle">Welcome to CivicMind AI</text>
    <text x="260" y="70" fill="#64748b" font-size="13" font-weight="500" text-anchor="middle">Intelligent Municipal Issue Management &amp; Spatial Analytics</text>

    <!-- Dual Tabs -->
    <rect x="40" y="90" width="440" height="42" rx="8" fill="#f1f5f9"/>
    <rect x="44" y="94" width="216" height="34" rx="6" fill="#ffffff"/>
    <text x="152" y="116" fill="#4f46e5" font-size="13" font-weight="700" text-anchor="middle">Sign In</text>
    
    <rect x="260" y="94" width="216" height="34" rx="6" fill="transparent"/>
    <text x="368" y="116" fill="#64748b" font-size="13" font-weight="600" text-anchor="middle">Create Account</text>

    <!-- Form Inputs (Sign In Active) -->
    <!-- Input 1: Email -->
    <text x="40" y="165" fill="#334155" font-size="12" font-weight="600">Email Address</text>
    <rect x="40" y="175" width="440" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="56" y="202" fill="#0f172a" font-size="14">alice@test.com</text>

    <!-- Input 2: Password -->
    <text x="40" y="245" fill="#334155" font-size="12" font-weight="600">Password</text>
    <rect x="40" y="255" width="440" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="56" y="282" fill="#0f172a" font-size="16">••••••••••••••••</text>
    <circle cx="455" cy="277" r="10" fill="#e2e8f0"/>
    <text x="455" y="281" fill="#64748b" font-size="10" text-anchor="middle">👁️</text>

    <!-- Sign In Button -->
    <rect x="40" y="320" width="440" height="46" rx="8" fill="url(#primaryGrad)"/>
    <text x="260" y="348" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">Sign In to Dashboard →</text>

    <!-- Demo Accounts Pill Box -->
    <rect x="40" y="385" width="440" height="105" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="55" y="405" fill="#475569" font-size="11" font-weight="700">⚡ QUICK DEMO CREDENTIALS (CLICK TO TEST):</text>
    
    <!-- Admin Pill -->
    <rect x="55" y="415" width="125" height="30" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="63" y="433" fill="#991b1b" font-size="10" font-weight="700">👑 Admin</text>
    <text x="63" y="458" fill="#64748b" font-size="9">admin@city.com</text>

    <!-- Manager Pill -->
    <rect x="195" y="415" width="130" height="30" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
    <text x="203" y="433" fill="#1e40af" font-size="10" font-weight="700">👮 Manager / Officer</text>
    <text x="203" y="458" fill="#64748b" font-size="9">manager@city.com</text>

    <!-- Citizen Pill -->
    <rect x="340" y="415" width="125" height="30" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
    <text x="348" y="433" fill="#166534" font-size="10" font-weight="700">👤 Citizen</text>
    <text x="348" y="458" fill="#64748b" font-size="9">alice@test.com</text>

    <text x="260" y="480" fill="#94a3b8" font-size="10" text-anchor="middle">Password for all demo accounts: [Role]Civic2026!</text>
  </g>
</svg>
