<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" width="100%" height="100%" style="background:#f8fafc; border-radius:12px; font-family:'Segoe UI',system-ui,sans-serif;">
  <defs>
    <linearGradient id="navGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="softShadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Browser Header -->
  <rect x="0" y="0" width="1100" height="42" fill="#1e293b"/>
  <circle cx="24" cy="21" r="6" fill="#ef4444"/>
  <circle cx="44" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="21" r="6" fill="#10b981"/>
  <rect x="200" y="8" width="700" height="26" rx="6" fill="#0f172a"/>
  <text x="550" y="25" fill="#94a3b8" font-size="12" text-anchor="middle">http://localhost:5173/citizen — CivicMind AI Citizen Dashboard</text>

  <!-- Navbar -->
  <rect x="0" y="42" width="1100" height="64" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="80" fill="#0f172a" font-size="20" font-weight="800">CivicMind <tspan fill="#6366f1">AI</tspan></text>
  
  <!-- User Profile Badge & Logout -->
  <g transform="translate(860, 56)">
    <rect width="130" height="34" rx="17" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <circle cx="18" cy="17" r="5" fill="#10b981"/>
    <text x="32" y="22" fill="#065f46" font-size="12" font-weight="700">Citizen: Alice</text>
    <rect x="140" y="0" width="75" height="34" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="177" y="22" fill="#991b1b" font-size="12" font-weight="600" text-anchor="middle">Logout</text>
  </g>

  <!-- Main Container -->
  <!-- Left Column: Report Issue Form -->
  <g transform="translate(40, 130)" filter="url(#softShadow)">
    <rect width="480" height="420" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <text x="24" y="36" fill="#0f172a" font-size="18" font-weight="800">📝 Report a Civic Issue</text>
    <text x="24" y="56" fill="#64748b" font-size="12">Our AI classifier will automatically categorize and route your ticket.</text>
    
    <!-- Description Box -->
    <text x="24" y="88" fill="#334155" font-size="12" font-weight="600">Issue Description (Min 10 characters)</text>
    <rect x="24" y="96" width="432" height="65" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="36" y="118" fill="#0f172a" font-size="13">Massive water pipe bursting and leaking heavily onto the road,</text>
    <text x="36" y="136" fill="#0f172a" font-size="13">causing severe flooding near the bus stop.</text>

    <!-- Address / Geocoding Box -->
    <text x="24" y="185" fill="#334155" font-size="12" font-weight="600">Detected Street Address (Reverse Geocoded)</text>
    <rect x="24" y="193" width="432" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="36" y="217" fill="#1e40af" font-size="12" font-weight="600">📍 Old Kuyavarpalayam Road, Munichalai, Madurai, TN</text>

    <!-- Camera Box -->
    <text x="24" y="255" fill="#334155" font-size="12" font-weight="600">Live Camera Photo Proof (WebRTC)</text>
    <rect x="24" y="263" width="432" height="75" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>
    <rect x="36" y="273" width="70" height="55" rx="4" fill="#3b82f6"/>
    <text x="71" y="305" fill="#ffffff" font-size="18" text-anchor="middle">📷</text>
    <text x="120" y="295" fill="#0f172a" font-size="12" font-weight="700">Photo Attached (Base64 JPEG)</text>
    <text x="120" y="313" fill="#10b981" font-size="11">✓ High resolution visual evidence compressed</text>

    <!-- Submit Button -->
    <rect x="24" y="355" width="432" height="44" rx="8" fill="url(#btnGrad)"/>
    <text x="240" y="382" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">🚀 Submit Complaint with AI Triage</text>
  </g>

  <!-- Right Column: Interactive Leaflet Map (Centered on India) -->
  <g transform="translate(550, 130)" filter="url(#softShadow)">
    <rect width="510" height="420" rx="12" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
    
    <!-- Map Graphic / India Outline representation -->
    <rect width="510" height="420" rx="12" fill="#cbd5e1"/>
    
    <!-- Map Tiles Mock -->
    <path d="M 0,0 L 510,0 L 510,420 L 0,420 Z" fill="#e2e8f0"/>
    <!-- Water bodies -->
    <path d="M 0,260 Q 150,220 250,300 T 510,340 L 510,420 L 0,420 Z" fill="#93c5fd" opacity="0.4"/>
    <!-- Roads mock -->
    <line x1="50" y1="50" x2="450" y2="380" stroke="#ffffff" stroke-width="6"/>
    <line x1="450" y1="80" x2="80" y2="350" stroke="#fcd34d" stroke-width="4"/>
    <line x1="250" y1="0" x2="250" y2="420" stroke="#ffffff" stroke-width="4"/>

    <!-- Map Controls Top Bar -->
    <g transform="translate(15, 15)">
      <rect width="180" height="34" rx="6" fill="#ffffff" filter="url(#softShadow)"/>
      <text x="90" y="22" fill="#1e293b" font-size="12" font-weight="700" text-anchor="middle">📍 Detect My Location</text>
      
      <rect x="190" y="0" width="140" height="34" rx="6" fill="#ffffff" filter="url(#softShadow)"/>
      <text x="260" y="22" fill="#1e293b" font-size="12" font-weight="700" text-anchor="middle">🇮🇳 Center India</text>
    </g>

    <!-- Center Blue Leaflet Pin -->
    <g transform="translate(255, 210)">
      <circle cx="0" cy="0" r="16" fill="#3b82f6" opacity="0.3"/>
      <circle cx="0" cy="0" r="8" fill="#1d4ed8"/>
      <path d="M 0,0 L 0,-28" stroke="#1d4ed8" stroke-width="3"/>
      <circle cx="0" cy="-28" r="12" fill="#ef4444"/>
      <circle cx="0" cy="-28" r="4" fill="#ffffff"/>
      
      <!-- Leaflet Popup Box -->
      <rect x="-90" y="-85" width="180" height="46" rx="6" fill="#1e293b" filter="url(#softShadow)"/>
      <polygon points="-8,-39 0,-33 8,-39" fill="#1e293b"/>
      <text x="0" y="-68" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Incident Coordinates</text>
      <text x="0" y="-52" fill="#38bdf8" font-size="10" text-anchor="middle">Lat: 9.9252 • Lng: 78.1198</text>
    </g>
    
    <!-- Attribution banner -->
    <rect x="0" y="396" width="510" height="24" rx="0" fill="#ffffff" opacity="0.9"/>
    <text x="10" y="412" fill="#64748b" font-size="10">Leaflet | © OpenStreetMap Contributors • Default locked to India [20.5937, 78.9629]</text>
  </g>

  <!-- Bottom Section: My History Accordion Table -->
  <g transform="translate(40, 580)" filter="url(#softShadow)">
    <rect width="1020" height="205" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <text x="24" y="32" fill="#0f172a" font-size="16" font-weight="800">📋 My Submission History (Strictly Scoped to You)</text>
    <text x="24" y="50" fill="#64748b" font-size="12">Real-time status updates from field engineers. Other citizens' tickets are protected by privacy filters.</text>
    
    <!-- Table Header -->
    <rect x="20" y="65" width="980" height="32" fill="#f8fafc"/>
    <text x="36" y="86" fill="#64748b" font-size="11" font-weight="700">TICKET #</text>
    <text x="120" y="86" fill="#64748b" font-size="11" font-weight="700">ISSUE DESCRIPTION</text>
    <text x="460" y="86" fill="#64748b" font-size="11" font-weight="700">AI DEPARTMENT</text>
    <text x="660" y="86" fill="#64748b" font-size="11" font-weight="700">LOCATION</text>
    <text x="890" y="86" fill="#64748b" font-size="11" font-weight="700">STATUS</text>

    <!-- Row 1 -->
    <text x="36" y="118" fill="#0f172a" font-size="12" font-weight="700">#104</text>
    <text x="120" y="118" fill="#0f172a" font-size="12">Massive water pipe bursting and leaking heavily</text>
    <rect x="460" y="104" width="130" height="22" rx="4" fill="#eff6ff"/>
    <text x="470" y="119" fill="#1e40af" font-size="11" font-weight="600">Water &amp; Sanitation</text>
    <text x="660" y="118" fill="#64748b" font-size="12">Munichalai, Madurai</text>
    <rect x="890" y="104" width="70" height="22" rx="11" fill="#fef3c7"/>
    <text x="925" y="119" fill="#92400e" font-size="11" font-weight="700" text-anchor="middle">Pending</text>
    <line x1="20" y1="134" x2="1000" y2="134" stroke="#f1f5f9"/>

    <!-- Row 2 -->
    <text x="36" y="156" fill="#0f172a" font-size="12" font-weight="700">#098</text>
    <text x="120" y="156" fill="#0f172a" font-size="12">Streetlight pole wire hanging low near entrance</text>
    <rect x="460" y="142" width="90" height="22" rx="4" fill="#fef2f2"/>
    <text x="470" y="157" fill="#991b1b" font-size="11" font-weight="600">Electricity</text>
    <text x="660" y="156" fill="#64748b" font-size="12">West Masi Street</text>
    <rect x="890" y="142" width="75" height="22" rx="11" fill="#dbeafe"/>
    <text x="927" y="157" fill="#1e40af" font-size="11" font-weight="700" text-anchor="middle">In Progress</text>
    <line x1="20" y1="172" x2="1000" y2="172" stroke="#f1f5f9"/>

    <!-- Row 3 -->
    <text x="36" y="194" fill="#0f172a" font-size="12" font-weight="700">#072</text>
    <text x="120" y="194" fill="#0f172a" font-size="12">Severe pothole on high traffic corner</text>
    <rect x="460" y="180" width="70" height="22" rx="4" fill="#f3f4f6"/>
    <text x="470" y="195" fill="#374151" font-size="11" font-weight="600">Roads</text>
    <text x="660" y="194" fill="#64748b" font-size="12">Simmakkal Circle</text>
    <rect x="890" y="180" width="75" height="22" rx="11" fill="#dcfce7"/>
    <text x="927" y="195" fill="#166534" font-size="11" font-weight="700" text-anchor="middle">Resolved</text>
  </g>
</svg>
